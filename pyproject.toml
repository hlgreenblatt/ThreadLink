[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threadlink"
version = "0.4.0"
description = "A QUIC (RFC 9000) + TLS 1.3 comlink for agent swarms — transport only, any protocol rides on top."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Larry Greenblatt" }]
dependencies = [
    # threadlink/pq.py patches this exact aioquic (fingerprint-checked); any other version
    # still works, but classically - the post-quantum handshake stays off.
    "aioquic==1.3.0",
    # ML-KEM + ML-DSA come from cryptography's bundled OpenSSL 3.5+.
    "cryptography>=48",
]

[project.urls]
Homepage = "https://github.com/hlgreenblatt/ThreadLink"
"First consumer (ThreadHello / ThreadRouter)" = "https://github.com/hlgreenblatt/ThreadRouter"

[tool.setuptools]
packages = ["threadlink"]

[tool.setuptools.package-data]
threadlink = ["LICENSE.aioquic"]
