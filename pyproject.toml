[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threadlink"
version = "0.5.0"
description = "The ThreadLink toolkit: a QUIC (RFC 9000) + mutual-TLS comlink for agent swarms, with ThreadHello, ThreadChat, ThreadRouter and ThreadWatch riding on it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Larry Greenblatt" }]
dependencies = [
    # threadlink/pq.py patches this exact aioquic (fingerprint-checked); any other version
    # still works, but classically - the post-quantum handshake stays off.
    "aioquic==1.3.0",
    # ML-KEM + ML-DSA come from cryptography's bundled OpenSSL 3.5+.
    "cryptography>=48",
]

[project.optional-dependencies]
# ThreadRouter's learning net is FabricPC (its own repo, not vendored). Install it beside the toolkit:
#   git clone https://github.com/trueagi-io/FabricPC && pip install -e ./FabricPC
#   and put the FabricPC folder on PYTHONPATH (tk_router imports its jax_setup.py).
# Without it the router still imports and simply makes no prediction.
# The framework adapters under adapters/ (Hermes letter tool, Omega hub node, Omega router skill).
adapters = ["mcp>=2.3", "uvicorn", "websockets>=13", "requests"]

[project.scripts]
threadwatch = "threadlink.watch:main"

[project.urls]
Homepage = "https://github.com/hlgreenblatt/ThreadLink"
Specification = "https://github.com/hlgreenblatt/ThreadLink/tree/main/spec"

[tool.setuptools]
packages = ["threadlink", "threadhello", "threadchat", "threadrouter"]

[tool.setuptools.package-data]
threadlink = ["LICENSE.aioquic"]
threadrouter = ["env.example", "router_sample.jsonl"]
